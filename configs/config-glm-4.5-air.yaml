wandb:
  run_name: zai-org/GLM-4.5-Air
api: vllm-docker
num_gpus: 4
batch_size: 128
model:
  use_wandb_artifacts: false
  pretrained_model_name_or_path: zai-org/GLM-4.5-Air
  bfcl_model_id: "unified-oss-fc"
  size_category: "Large (30B+)"
  size: 110468824832
  release_date: 07/28/2025

vllm: # This config not used because vLLM launched manually, but for record
  vllm_tag: v0.12.0
  lifecycle: always_on
  gpu_memory_utilization: 0.95
  reasoning_parser: glm45
  tool_call_parser: glm45
  enable_auto_tool_choice: true
  trust_remote_code: true

generator:
  max_tokens: 131072
  temperature: 0.6
  top_p: 0.95

