wandb:
  run_name: "llm-jp/llm-jp-4-8b-thinking"

api: openai-compatible
base_url: "http://100.66.47.69:8001/v1"
batch_size: 16

model:
  use_wandb_artifacts: false
  # Must match the model name exposed by the vLLM server exactly.
  # If you launch with `--served-model-name llm-jp-4-8b-thinking`,
  # change this field to that exact string.
  pretrained_model_name_or_path: llm-jp/llm-jp-4-8b-thinking
  # Harmony-compatible tool calling on vLLM should use native function calling.
  bfcl_model_id: "unified-oss-fc"
  base_model: "llm-jp-4"
  size_category: "Small (<10B)"
  size: 8590200000
  release_date: 4/8/2026

vllm:
  # In `api: openai-compatible` mode these values are NOT applied automatically
  # to the external server. They are documentation for the required launch
  # flags and make the config reusable if you later switch back to repo-managed
  # vLLM.
  max_model_len: 65536
  reasoning_parser: llmjp4
  trust_remote_code: true
  enable_auto_tool_choice: true
  tool_call_parser: openai

# llm-jp-4 thinking models use an OpenAI Harmony-compatible template via the
# custom tokenizer loaded with `trust_remote_code=True`.
# Do not pass `--chat-template` unless you intentionally want to override that
# tokenizer-provided template.
generator:
  max_tokens: 25000
  temperature: 1.0
  top_p: 0.95
  tool_choice: none # Prevent accidental tool calls outside BFCL.
  extra_body:
    skip_special_tokens: false
    chat_template_kwargs:
      reasoning_effort: high

jaster:
  override_max_tokens: 25000

jbbq:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

toxicity:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

jtruthfulqa:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

swebench:
  max_tokens: 25000

mtbench:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high
  temperature_override:
    writing: 1.0
    roleplay: 1.0
    extraction: 1.0
    math: 1.0
    coding: 1.0
    reasoning: 1.0
    stem: 1.0
    humanities: 1.0

bfcl:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    tool_choice: auto
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high
  handler_config:
    unified_oss_fc:
      # The llm-jp tokenizer requires trust_remote_code and carries a custom
      # Harmony template, so skip HF tokenizer loading for the external server.
      skip_hf_tokenizer: true
      max_context_length_override: 65536

hallulens:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

hle:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

arc_agi:
  max_output_tokens: 25000

m_ifeval:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        reasoning_effort: high

openai:
  http_timeout:
    connect: 10.0
    read: 3600.0
    write: 300.0
    pool: 30.0
