wandb:
  run_name: "tokyotech-llm/GPT-OSS-Swallow-120B-RL-v0.1"

api: openai-compatible
base_url: "http://100.91.253.111:8000/v1"
num_gpus: 8
batch_size: 4

model:
  use_wandb_artifacts: false
  pretrained_model_name_or_path: "tokyotech-llm/GPT-OSS-Swallow-120B-RL-v0.1"
  # The model card says function calling is not specifically trained/tested.
  # Use guided JSONSchema prompting for BFCL instead of native FC/tool parsing.
  bfcl_model_id: "unified-oss-jsonschema"
  base_model: "tokyotech-llm/GPT-OSS-Swallow-120B-SFT-v0.1"
  size_category: "Large (30B+)"
  size: 116829200000
  release_date: 2/20/2026

vllm:
  # In openai-compatible mode these values document the required SUNK vLLM launch settings.
  # They are not applied automatically by this evaluator process.
  vllm_tag: latest
  dtype: bfloat16
  # The model supports 131072 tokens, but the card recommends staying within
  # 32768 input tokens because long-context extrapolation can degrade accuracy.
  # 65536 still leaves room for the 24576-token RL output budget.
  max_model_len: 65536
  gpu_memory_utilization: 0.95
  reasoning_parser: openai_gptoss
  trust_remote_code: false
  enable_auto_tool_choice: false
  tool_call_parser: null
  # Avoid --async-scheduling here: BFCL uses structured output/response_format.
  extra_args:
    - "--no-enable-prefix-caching"
    - "--max-num-batched-tokens"
    - "8192"
    - "--max-cudagraph-capture-size"
    - "2048"

generator:
  # RL training used 24576 as the maximum output length.
  max_tokens: 24576
  temperature: 0.6
  top_p: 0.95
  tool_choice: none
  extra_body:
    top_k: 20
    min_p: 0
    chat_template_kwargs:
      reasoning_effort: high

jaster:
  override_max_tokens: 24576

