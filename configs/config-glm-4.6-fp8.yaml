wandb:
  run_name: zai-org/GLM-4.6-FP8
api: vllm-docker
num_gpus: 8
batch_size: 64
model:
  use_wandb_artifacts: false
  pretrained_model_name_or_path: zai-org/GLM-4.6-FP8
  bfcl_model_id: "unified-oss-fc"
  size_category: "Large (30B+)"
  size: 358458543424
  release_date: 09/30/2025

vllm: # This config not used because vLLM launched manually, but for record
  vllm_tag: v0.12.0
  lifecycle: always_on
  gpu_memory_utilization: 0.95
  reasoning_parser: glm45
  tool_call_parser: glm45
  enable_auto_tool_choice: true
  trust_remote_code: true

