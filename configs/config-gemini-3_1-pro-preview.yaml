wandb:
  run_name: google/gemini-3.1-pro-preview
api: google # openai, anthropic, google,..
batch_size: 4
inference_interval: 2
model:
  pretrained_model_name_or_path: gemini-3.1-pro-preview # if you use openai api, put the name of model
  bfcl_model_id: "gemini-3.1-pro-preview-FC" # find id from "llm-leaderboard/scripts/evaluator/evaluate_utils/bfcl_pkg/SUPPORTED_MODELS.md"
  base_model: "unknown"
  size_category: api
  size: null
  # Gemini 3.1 Pro preview: public information around 2026-02 (mm/dd/yyyy)
  release_date: 2/1/2026
  # Gemini 3.1 では thinking_level 推奨（thinking_budget と同時指定しない）
  thinking_level: high
  safety_settings:
    - category: "HARM_CATEGORY_HATE_SPEECH"
      threshold: "BLOCK_NONE"
    - category: "HARM_CATEGORY_SEXUALLY_EXPLICIT"
      threshold: "BLOCK_NONE"
    - category: "HARM_CATEGORY_DANGEROUS_CONTENT"
      threshold: "BLOCK_NONE"
    - category: "HARM_CATEGORY_HARASSMENT"
      threshold: "BLOCK_NONE"
    - category: "HARM_CATEGORY_CIVIC_INTEGRITY"
      threshold: "BLOCK_NONE"

generator: # LLM client default configuration: to be overridden by each benchmark
  max_tokens: 65000

jaster:
  override_max_tokens: 65000 # if null, use value defined in task dataset files

jbbq:
  generator_config:
    max_tokens: 65000

toxicity:
  generator_config:
    max_tokens: 65000

jtruthfulqa:
  generator_config:
    max_tokens: 65000

swebench:
  max_tokens: 65000

mtbench:
  generator_config:
    max_tokens: 65000

bfcl:
  generator_config:
    max_tokens: 65000

hallulens:
  generator_config:
    max_tokens: 65000

hle:
  generator_config:
    max_tokens: 65000

arc_agi:
  max_output_tokens: 65000

m_ifeval:
  generator_config:
    max_tokens: 65000
