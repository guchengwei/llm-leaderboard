wandb:
  run_name: "Qwen/Qwen3-235B-A22B-Thinking-2507" # use run_name defined above

api: vllm-docker
num_gpus: 8
batch_size: 256

model:
  use_wandb_artifacts: false
  pretrained_model_name_or_path: "Qwen/Qwen3-235B-A22B-Thinking-2507" #if you use openai api, put the name of model
  bfcl_model_id: "unified-oss-fc"
  size_category: "Large (30B+)"
  size: 235093634560
  release_date: "7/21/2025"

vllm:
  vllm_tag: v0.12.0
  gpu_memory_utilization: 0.95
  reasoning_parser: deepseek_r1
  tool_call_parser: hermes
  enable_auto_tool_choice: true

generator:
  max_tokens: 262144
  temperature: 0.6
  top_p: 0.95

jaster:
  override_max_tokens: 262144

jbbq:
