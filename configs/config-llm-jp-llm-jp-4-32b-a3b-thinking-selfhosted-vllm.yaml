wandb:
  run_name: "llm-jp/llm-jp-4-32b-a3b-thinking"

api: openai-compatible
base_url: "http://100.91.253.111:8000/v1"
batch_size: 8

model:
  use_wandb_artifacts: false
  # Must match the model name exposed by the vLLM server exactly.
  # If you launch with `--served-model-name llm-jp-4-32b-a3b-thinking`,
  # change this field to that exact string.
  pretrained_model_name_or_path: llm-jp/llm-jp-4-32b-a3b-thinking
  # The cookbook provides an llmjp4 reasoning parser, but no native vLLM tool parser.
  # Use JSONSchema prompting for BFCL instead of server-side tool parsing.
  bfcl_model_id: "unified-oss-jsonschema"
  # Client-side safety net for raw Harmony responses if the server returns unparsed non-streaming output.
  response_postprocess: "llmjp4_harmony_final"
  base_model: "llm-jp/llm-jp-4-32b-a3b-base"
  size_category: "Large (30B+)"
  size: 32139000000
  release_date: 4/8/2026

vllm:
  # In `api: openai-compatible` mode these values are NOT applied automatically
  # to the external server. They are documentation for the required launch
  # flags and make the config reusable if you later switch back to repo-managed
  # vLLM.
  max_model_len: 65536
  # Launch the external server via llm-jp's cookbook example_cli.py, or pass
  # --reasoning-parser-plugin /path/to/llmjp4_reasoning_parser.py.
  reasoning_parser: llmjp4
  trust_remote_code: true
  enable_auto_tool_choice: false
  tool_call_parser: null

# llm-jp-4 thinking models use an OpenAI Harmony-compatible template via the
# custom tokenizer loaded with `trust_remote_code=True`.
# Do not pass `--chat-template` unless you intentionally want to override that
# tokenizer-provided template.
generator:
  # Leave room for long prompts / multi-turn benches while still allowing
  # substantial reasoning output.
  max_tokens: 25000
  temperature: 1.0
  top_p: 0.95
  tool_choice: none # Prevent accidental tool calls outside BFCL.
  extra_body:
    skip_special_tokens: true
    chat_template_kwargs:
      reasoning_effort: high

jaster:
  override_max_tokens: 25000

jbbq:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

toxicity:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

jtruthfulqa:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

swebench:
  max_tokens: 25000

mtbench:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high
  temperature_override:
    writing: 1.0
    roleplay: 1.0
    extraction: 1.0
    math: 1.0
    coding: 1.0
    reasoning: 1.0
    stem: 1.0
    humanities: 1.0

bfcl:
  generator_config:
    max_tokens: 25000
    temperature: 0.1
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high
  handler_config:
    unified_oss_jsonschema:
      # The llm-jp tokenizer requires trust_remote_code and carries a custom
      # Harmony template, so skip HF tokenizer loading for the external server.
      skip_hf_tokenizer: true
      max_context_length_override: 65536
      execution_result_role: "user"
      execution_result_include_call_str: false
      execution_result_include_call_id: false
      execution_result_join_parallel_calls: true

hallulens:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

hle:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

arc_agi:
  max_output_tokens: 25000

m_ifeval:
  generator_config:
    max_tokens: 25000
    temperature: 1.0
    top_p: 0.95
    extra_body:
      skip_special_tokens: true
      chat_template_kwargs:
        reasoning_effort: high

openai:
  http_timeout:
    connect: 10.0
    read: 3600.0
    write: 300.0
    pool: 30.0
